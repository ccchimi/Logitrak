  <text x="200" y="932" text-anchor="middle" font-size="14" fill="#44546A">ccchimi/Logitrak · rama main</text>
  <text x="200" y="955" text-anchor="middle" font-size="14" fill="#44546A">hook pre-commit</text>

  <rect x="430" y="870" width="320" height="120" rx="10" fill="#FFFFFF" stroke="#7F7F7F"/>
  <text x="590" y="905" text-anchor="middle" font-size="18" font-weight="bold" fill="#404040">GitHub Actions · CI</text>
  <text x="590" y="932" text-anchor="middle" font-size="14" fill="#44546A">pruebas frontend + backend</text>
  <text x="590" y="955" text-anchor="middle" font-size="14" fill="#44546A">cobertura · npm audit · semanal</text>

  <rect x="850" y="860" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#7F7F7F"/>
  <text x="1010" y="887" text-anchor="middle" font-size="16" font-weight="bold" fill="#404040">GitHub Pages</text>
  <text x="1010" y="907" text-anchor="middle" font-size="13" fill="#44546A">Web App (expo export --platform web)</text>
  <rect x="850" y="930" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#7F7F7F"/>
  <text x="1010" y="957" text-anchor="middle" font-size="16" font-weight="bold" fill="#404040">Render</text>
  <text x="1010" y="977" text-anchor="middle" font-size="13" fill="#44546A">API (deploy automático desde main)</text>

  <rect x="1250" y="890" width="280" height="80" rx="10" fill="#FFFFFF" stroke="#7F7F7F"/>
  <text x="1390" y="922" text-anchor="middle" font-size="16" font-weight="bold" fill="#404040">EAS Build</text>
