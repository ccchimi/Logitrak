# Integración continua: corre la batería de pruebas del cotizador en cada push
# y pull request a main, y una vez por semana aunque no haya cambios (para
# detectar roturas por dependencias o por el calendario de tarifas).
# Ver docs/qa/plan-de-mantenimiento.md, sección 2.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # lunes 03:00 (hora Argentina)
  workflow_dispatch:

jobs:
  pruebas-frontend:
    name: Pruebas unitarias y cobertura (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Falla si algún test falla o si la cobertura baja del coverageThreshold
      # de jest.config.js (80 % sentencias/funciones/líneas, 70 % ramas).
      - run: npm run test:coverage -- --ci

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          retention-days: 30

      # Vulnerabilidades conocidas en dependencias. Por ahora informa sin frenar:
      # las críticas actuales (tar, shell-quote) vienen del CLI de Expo y se
      # resuelven actualizando el SDK. Ver plan-de-mantenimiento.md, sección 2.2.
      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

  pruebas-backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    # Base descartable para las pruebas de integración (sesiones contra
    # PostgreSQL real). Se crea vacía en cada corrida y se tira al terminar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # El backend usa una copia empaquetada del cotizador de la app (DEF-02).
      # Si alguien cambió el cotizador y no la regeneró, la CI falla acá.
      - name: Cotizador del servidor al día con el de la app
        run: |
          npm run generar:cotizador
          git diff --exit-code -- src/servicios/cotizador/cotizador.generado.js

      # TZ=UTC reproduce el entorno de Render: las franjas horarias tienen que
      # salir en hora argentina igual.
      - run: npm test
        env:
          TZ: UTC
          TEST_DATABASE_URL: postgresql://postgres:prueba@localhost:5432/postgres
